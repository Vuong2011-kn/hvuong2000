<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffd8eb">
<title>Vương (E Bé Ngân) | Profile</title>
<style>
  :root { --pink:#ff8fc7; --pink-dark:#e34c9c; --purple:#a58aff; --text:#35283b; --muted:#88788c; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; padding:28px 16px;
    display:flex; align-items:center; justify-content:center;
    font-family:Arial, Helvetica, sans-serif; color:var(--text);
    background:linear-gradient(135deg,#fff4fa,#f5efff);
  }
  .profile {
    width:100%; max-width:420px; padding:28px 22px 22px;
    text-align:center; background:rgba(255,255,255,.88);
    border:1px solid #fff; border-radius:28px;
    box-shadow:0 18px 55px rgba(168,105,157,.16);
    animation:appear .6s ease both;
  }
  .avatar-border {
    width:138px; height:138px; padding:5px; margin:0 auto 17px;
    border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--purple));
    box-shadow:0 8px 25px #f49dce55;
  }
  .avatar { width:100%; height:100%; display:block; object-fit:cover; object-position:center 28%; border-radius:50%; border:3px solid white; }
  .tag {
    display:inline-block; padding:7px 12px; border-radius:999px;
    background:#fff0f8; color:#c74b91; font-size:11px; font-weight:bold; letter-spacing:1px;
  }
  h1 { margin:13px 0 7px; font-size:28px; letter-spacing:-.6px; }
  .subtitle { margin:0 auto 22px; max-width:300px; color:var(--muted); font-size:14px; line-height:1.6; }
  .links { display:grid; gap:11px; }
  .link {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 16px; border-radius:15px; text-align:left;
    text-decoration:none; color:var(--text); background:#fff8fc;
    border:1px solid #f8dceb; font-size:14px; font-weight:bold;
    transition:transform .2s, box-shadow .2s, background .2s;
  }
  .link:hover { transform:translateY(-3px); background:#fff0f8; box-shadow:0 8px 18px #e7a1ca30; }
  .left { display:flex; align-items:center; gap:11px; }
  .icon {
    display:grid; place-items:center; width:36px; height:36px; flex-shrink:0;
    border-radius:11px; background:linear-gradient(135deg,#ffacd5,#c5adff);
    color:white; font-size:17px;
  }
  .arrow { color:var(--pink-dark); font-size:18px; }
  .note { margin:20px 0 0; color:#a291a6; font-size:11px; }
  .heart { color:var(--pink-dark); }
  @keyframes appear { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @media (max-width:360px) { .profile { padding:23px 15px 19px; } h1 { font-size:25px; } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
</style>
